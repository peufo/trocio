services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - 127.0.0.1:27017:27017
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 15

  trocio:
    container_name: trocio
    image: node:18-alpine
    depends_on:
      - mongo
    command: sh -c "apk add g++ make py3-pip && npm i && npm run dev"
    ports:
      - 5173:5173
    working_dir: /app
    volumes:
      - ./:/app

volumes:
  mongo-data:
